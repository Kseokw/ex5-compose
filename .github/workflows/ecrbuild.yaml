# 워크플로우(작업) 이름
name: GitOps docker CICD Pipeline

# 1. 트리거 설정: 브랜치 정의
on:
  push:
    branches:
      - main

jobs:
  build-and-update:
    runs-on: ubuntu-latest # 실제 작업 주체
    
    # 작업 절차
    steps:
    - name: 소스코드 전송
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{secrets.DOCKER_USER}}
        password: ${{secrets.DOCKER_PASSWORD}}
    


    - name: AWS 자격 증명 설정
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{secrets.AWS_ACCESS_KEY}}
        aws-secret-access-key: ${{secrets.AWS_SECRETS_ACCESS_KEY}}
        aws-region: ${{secrets.AWS_REGION}}

    - name: S3 정적웹사이트로 배포
      run: |
       aws s3 cp ./docker-compose.yaml s3://std07-git-web-s3/docker-compose.yaml
  
    # ECR에 DOCKER 이미지 빌드 및 푸시
    # 이거는 git에서 시키는 ubuntu가 하는거야? ec2가 하는거야?
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2 

    - name: Build and push Docker image to ECR
      #  env:
      #   ECR_REGISTRY: ${{}}
      #   ECR_REPOSITORY: ${{}}
      #   IMAGE_TAG: ${{github.sha}}
      run: |
        docker build --no-cache -t 925047940866.dkr.ecr.ap-southeast-1.amazonaws.com/std07/nginx:1.31.3-ecr ./nginx
        docker build --no-cache -t 925047940866.dkr.ecr.ap-southeast-1.amazonaws.com/std07/nginx:latest ./nginx

        docker push 925047940866.dkr.ecr.ap-southeast-1.amazonaws.com/std07/nginx:1.31.3-ecr
        docker push 925047940866.dkr.ecr.ap-southeast-1.amazonaws.com/std07/nginx:latest

# [AWS계정ID].dkr.ecr.[리전].amazonaws.com/[레포지토리이름]:[태그]
    - name: docker로 배포
      run: |
       aws ssm send-command \
        --instance-ids "i-04ded75b962b12fa9" \
        --document-name "AWS-RunShellScript" \
        --parameters "commands=[
          \"sudo aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin 925047940866.dkr.ecr.ap-southeast-1.amazonaws.com\",
          \"sudo docker stop nginx-container || true\",
          \"sudo docker rm nginx-container\",
          \"sudo aws s3 cp s3://std07-git-web-s3/docker-compose.yaml ./docker-compose.yaml\",
          \"docker compose pull\",
          \"docker compose up -d --remove-orphans\",
          \"docker image prune -f\"
        ]" \
        --region ${{secrets.AWS_REGION}} \
        --comment "Deploying SSM Docker"
      

    # \"docker compose up -d --remove-orphans\" 현재 compose 안에 정의된 모든 서비스를 실행하고 파일과 일치하지 않는 서비스는 삭제
    # \"dockre image prune -f\" 현재 사용되지 않는 이미지삭제
